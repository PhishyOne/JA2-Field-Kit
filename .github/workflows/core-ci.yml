name: Core CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  fixture-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Run fixture-policy regression tests
        run: python3 -m unittest discover -s tools/tests -v

      - name: Validate pull-request head and proposed integration history
        if: github.event_name == 'pull_request'
        run: >-
          python3 tools/validate_fixture_manifest.py
          --head "${{ github.event.pull_request.head.sha }}"
          --head "$GITHUB_SHA"

      - name: Validate pushed head and reachable history
        if: github.event_name == 'push'
        run: python3 tools/validate_fixture_manifest.py --head "$GITHUB_SHA"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up supported Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run core tests
        run: gradle :core:test --no-daemon
