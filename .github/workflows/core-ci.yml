name: Core CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event.pull_request.base.sha || 'push' }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: read

jobs:
  fixture-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Establish and smoke-test exact-snapshot generator sandbox
        run: python3 -B tools/setup_bwrap_sandbox.py

      - name: Run fixture-policy regression tests
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Validate pull-request head and proposed integration history
        if: github.event_name == 'pull_request'
        run: >-
          python3 -B tools/validate_fixture_manifest.py
          --subject "pr-head=${{ github.event.pull_request.head.sha }}"
          --subject "integration-head=$GITHUB_SHA"
          --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate pushed head and reachable history
        if: github.event_name == 'push'
        run: >-
          python3 -B tools/validate_fixture_manifest.py
          --subject "push-head=$GITHUB_SHA"

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Establish and smoke-test exact-snapshot generator sandbox
        run: python3 -B tools/setup_bwrap_sandbox.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up supported Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Run core and Android shell checks
        run: >-
          gradle
          :core:test
          :android-app:testDebugUnitTest
          :android-app:lintDebug
          :android-app:assembleDebug
          --no-daemon
