name: Core CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event.pull_request.base.sha || 'push' }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: read

jobs:
  fixture-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Establish and smoke-test exact-snapshot generator sandbox
        run: python3 -B tools/setup_bwrap_sandbox.py

      - name: Run fixture-policy regression tests
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Validate pull-request head and proposed integration history
        if: github.event_name == 'pull_request'
        run: >-
          python3 -B tools/validate_fixture_manifest.py
          --subject "pr-head=${{ github.event.pull_request.head.sha }}"
          --subject "integration-head=$GITHUB_SHA"
          --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate pushed head and reachable history
        if: github.event_name == 'push'
        run: >-
          python3 -B tools/validate_fixture_manifest.py
          --subject "push-head=$GITHUB_SHA"

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Establish and smoke-test exact-snapshot generator sandbox
        run: python3 -B tools/setup_bwrap_sandbox.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up supported Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run core tests
        run: gradle :core:test --no-daemon

      - name: Install pinned Android command-line tools
        env:
          COMMAND_LINE_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          archive="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          android_sdk_root="$RUNNER_TEMP/android-sdk"
          curl --fail --silent --show-error --location \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$archive"
          echo "$COMMAND_LINE_TOOLS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$android_sdk_root/cmdline-tools"
          python3 -m zipfile -e "$archive" "$android_sdk_root/cmdline-tools"
          mv "$android_sdk_root/cmdline-tools/cmdline-tools" \
            "$android_sdk_root/cmdline-tools/latest"
          chmod u+x "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"

      - name: Install pinned Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android shell checks
        run: >-
          gradle
          :android-app:testDebugUnitTest
          :android-app:lintDebug
          :android-app:assembleDebug
          --no-daemon

  publish-debug-apk:
    needs: [fixture-policy, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up supported Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Install pinned Android command-line tools
        env:
          COMMAND_LINE_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          archive="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          android_sdk_root="$RUNNER_TEMP/android-sdk"
          curl --fail --silent --show-error --location \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$archive"
          echo "$COMMAND_LINE_TOOLS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$android_sdk_root/cmdline-tools"
          python3 -m zipfile -e "$archive" "$android_sdk_root/cmdline-tools"
          mv "$android_sdk_root/cmdline-tools/cmdline-tools" \
            "$android_sdk_root/cmdline-tools/latest"
          chmod u+x "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"

      - name: Install pinned Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: gradle :android-app:assembleDebug --no-daemon

      - name: Record debug APK provenance
        shell: bash
        run: |
          set -euo pipefail
          apk="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test -f "$apk"
          certificates=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
          certificate_sha256=$(printf '%s\n' "$certificates" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "$certificate_sha256" =~ ^[0-9a-fA-F]{64}$ ]]
          apk_size=$(stat -c %s "$apk")
          apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f 1)
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'build_type=debug\ntest_only=true\n'
            printf 'apk_size_bytes=%s\n' "$apk_size"
            printf 'apk_sha256=%s\n' "$apk_sha256"
            printf 'signer_1_certificate_sha256=%s\n' "$certificate_sha256"
          } > "$apk.provenance.txt"

      - name: Upload test-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ja2-field-kit-debug-${{ github.sha }}
          path: |
            android-app/build/outputs/apk/debug/android-app-debug.apk
            android-app/build/outputs/apk/debug/android-app-debug.apk.provenance.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
