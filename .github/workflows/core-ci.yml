name: Core CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event.pull_request.base.sha || 'push' }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: read

jobs:
  fixture-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Establish and smoke-test exact-snapshot generator sandbox
        run: python3 -B tools/setup_bwrap_sandbox.py

      - name: Run fixture-policy regression tests
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Validate pull-request head and proposed integration history
        if: github.event_name == 'pull_request'
        run: >-
          python3 -B tools/validate_fixture_manifest.py
          --subject "pr-head=${{ github.event.pull_request.head.sha }}"
          --subject "integration-head=$GITHUB_SHA"
          --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate pushed head and reachable history
        if: github.event_name == 'push'
        run: >-
          python3 -B tools/validate_fixture_manifest.py
          --subject "push-head=$GITHUB_SHA"

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture validator dependencies
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements/fixture-validation.lock

      - name: Establish and smoke-test exact-snapshot generator sandbox
        run: python3 -B tools/setup_bwrap_sandbox.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up supported Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Run core tests
        run: gradle :core:test --no-daemon

      - name: Install pinned Android command-line tools
        env:
          COMMAND_LINE_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          archive="$RUNNER_TEMP/commandlinetools-linux-15859902_latest.zip"
          android_sdk_root="$RUNNER_TEMP/android-sdk"
          curl --fail --silent --show-error --location \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$archive"
          echo "$COMMAND_LINE_TOOLS_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$android_sdk_root/cmdline-tools"
          python3 -m zipfile -e "$archive" "$android_sdk_root/cmdline-tools"
          mv "$android_sdk_root/cmdline-tools/cmdline-tools" \
            "$android_sdk_root/cmdline-tools/latest"
          chmod u+x "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$android_sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk_root" >> "$GITHUB_ENV"

      - name: Install pinned Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android shell checks
        run: >-
          gradle
          :android-app:testDebugUnitTest
          :android-app:lintDebug
          :android-app:assembleDebug
          --no-daemon
